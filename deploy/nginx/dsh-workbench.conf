# DSH 工作台本机网关（运行在 WebOS 所在 Windows 电脑）
#
# 外部访问链路：stdeepblue.eicp.net:8082
# → 花生壳/eicp 映射到本机 127.0.0.1:8082
# → 本机 Nginx → 本机 SSH 隧道 127.0.0.1:13080
# → 39.108.221.22 的 127.0.0.1:3080
# 不要开放 DSH 服务器的 3080 端口。

worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    map $http_upgrade $dsh_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8082;
        server_name stdeepblue.eicp.net;

        # 在本机 WebOS 后端校验登录 Cookie 和短时访问票据。
        location = /_dsh_auth {
            internal;
            proxy_pass http://127.0.0.1:8081/api/dsh/verify-access;
            proxy_pass_request_body off;
            proxy_set_header Content-Length '';
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            auth_request /_dsh_auth;
            error_page 401 403 = @dsh_unauthorized;

            # 由 PM2 守护的 SSH 隧道提供本机转发。
            proxy_pass http://127.0.0.1:13080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $dsh_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 100m;
            add_header Content-Security-Policy "frame-ancestors http://stdeepblue.eicp.net:8081" always;
        }

        location @dsh_unauthorized {
            default_type application/json;
            return 401 '{"success":false,"message":"请先登录 WebOS 后再访问 DSH 工作台"}';
        }
    }
}
